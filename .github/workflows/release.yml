# Build Kirby Super Star setup packs for four platforms.
#
# Manual dispatch makes versioned vX.Y.Z releases. Commits to main publish the
# stable-name Nightly release used by the in-app updater. A Nightly contains a
# setup host plus source and portable build tools; players generate the game
# locally from their own ROM. No ROM or generated ROM-derived C is distributed.
#
# Nightly assets are overwritten in place. Their SHA-256 files and
# nightly-manifest.json are consumed by tools/in_app_updater.py.
#
# The toolchain is embedded by default so the first run needs no tool download.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Tag this commit and publish a public GitHub Release'
        type: boolean
        default: true
      version:
        description: 'Version to release, e.g. 0.2.0 (empty = bump the latest v* tag)'
        type: string
        default: ''
      bump:
        description: 'When version is empty, which part of the latest tag to bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      embed_toolchain:
        description: 'Embed the cmake-clang-v1 pack in each zip (else the launcher downloads it)'
        type: boolean
        default: true
      toolchain_tag:
        description: 'retcomm-toolchains release to build with (empty = latest)'
        type: string
        default: ''
      verify_pins:
        description: 'Fail if the submodules disagree with framework_pins.txt'
        type: boolean
        default: false

# Serialize each ref like the Worms workflow: don't let overlapping pushes
# race while the Nightly tag and release assets are replaced.
concurrency:
  group: kirby-release-${{ github.event_name }}-${{ github.ref }}
  # Nightly is a rolling channel: only the newest main commit should publish.
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXE_NAME: KirbySuperStarSNESRecomp
  ZIP_PREFIX: kirbysuperstar

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Record framework pins
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${{ inputs.verify_pins }}" == "true" ]]; then
            ARGS+=(--check framework_pins.txt)
          fi
          bash snesrecomp/tools/ci/record_pins.sh "${ARGS[@]}"

      - name: Resolve release version
        id: meta
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump || 'patch' }}
          IN_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          # Pushes to main publish the rolling Nightly. Workflow dispatches
          # remain deliberate, versioned releases or dry runs.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]]; then
            echo "version=Nightly" >>"$GITHUB_OUTPUT"
            echo "tag=Nightly" >>"$GITHUB_OUTPUT"
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "publishing Nightly from ${GITHUB_SHA::12}"
            exit 0
          fi
          PUBLISH=true
          [[ "${IN_PUBLISH}" == "false" ]] && PUBLISH=false
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          RAW="$(printf '%s' "${IN_VERSION}" | tr -d '[:space:]')"
          LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"

          if [[ -n "${RAW}" ]]; then
            VER="${RAW#v}"
            echo "version given: ${VER}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Started from an existing tag: release exactly that.
            VER="${GITHUB_REF_NAME#v}"
            echo "running on tag ${GITHUB_REF_NAME}: releasing ${VER}"
          elif [[ -z "${LATEST}" ]]; then
            # First release: VERSION says what it is.
            VER="${FILE_VER}"
            echo "no v* tag yet: first release is VERSION = ${VER}"
          else
            BASE="${LATEST#v}"; BASE="${BASE%%[-+]*}"
            IFS=. read -r MA MI PA <<<"${BASE}"
            case "${IN_BUMP}" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *)     PA=$((PA + 1)) ;;
            esac
            VER="${MA}.${MI}.${PA}"
            # A deliberate bump of VERSION in the tree outranks the automatic
            # patch step, so a maintainer can move to 0.2.0 by editing the file.
            if [[ "$(printf '%s\n%s\n' "${FILE_VER}" "${VER}" | sort -V | tail -n1)" == "${FILE_VER}" \
                  && "${FILE_VER}" != "${BASE}" ]]; then
              echo "VERSION (${FILE_VER}) is ahead of ${LATEST} bumped (${VER}); using VERSION"
              VER="${FILE_VER}"
            else
              echo "auto-bump ${IN_BUMP}: ${LATEST} -> ${VER}"
            fi
          fi

          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::'${VER}' is not a version (want X.Y.Z)"
            exit 1
          fi
          TAG="v${VER}"
          if [[ "${PUBLISH}" == "true" && "${GITHUB_REF}" != "refs/tags/${TAG}" ]] \
             && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::tag ${TAG} already exists at $(git rev-parse --short "${TAG}"). Pass a new version, or start the run from that tag to re-release it."
            exit 1
          fi

          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >>"$GITHUB_OUTPUT"
          echo "release ${TAG} from ${GITHUB_SHA::12}; publish=${PUBLISH}"

  build:
    name: ${{ matrix.artifact }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    defaults:
      run:
        shell: bash
    env:
      # The lobby pin compiled into the binary and written into the pack's
      # VERSION, so the tag, the binary and the player's own rebuild agree.
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      # Optional private source for the pinned ROM. The URL/token stay in Actions secrets.
      KIRBY_ROM_URL: ${{ secrets.KIRBY_ROM_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # The framework can copy root rom.cfg beside the executable. This ignored
      # file stores an absolute path on one machine; never let it reach release CI.
      - name: Reject local-only ROM data and clear ROM path cache
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch -- rom.cfg >/dev/null 2>&1; then
            echo "::error::rom.cfg is tracked; it can leak a machine-specific disc path."
            exit 1
          fi
          BAD_ROMS="$(git ls-files -- '*.sfc' '*.smc' '*.srm' '*.fig' || true)"
          if [[ -n "${BAD_ROMS}" ]]; then
            echo "::error::ROM or memory-card files are tracked:"
            printf '%s\n' "${BAD_ROMS}"
            exit 1
          fi
          rm -f rom.cfg build-ci/rom.cfg
          echo "No tracked ROM images or local ROM-path cache."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test updater safety
        run: |
          set -euo pipefail
          python -m py_compile tools/in_app_updater.py tools/test_nightly_updater.py tools/apply_kirby_updater_patch.py
          python tools/test_nightly_updater.py
          bash -n scripts/package_release.sh scripts/package_native_release.sh scripts/macos_app_launcher.sh scripts/package_playable_macos_app.sh scripts/package_playable_release.sh

      - name: Record framework pins
        run: bash snesrecomp/tools/ci/record_pins.sh

      # A setup host is defined by what it lacks. The checkout must carry no
      # generated C; if it ever does, that is committed ROM-derived output and
      # the build must stop here rather than package it.
      - name: Assert no generated C in the tree
        run: |
          set -euo pipefail
          if compgen -G 'src/gen/*.c' >/dev/null || [[ -f recomp/funcs.h ]]; then
            echo "::error::src/gen/*.c or recomp/funcs.h is present in the checkout."
            exit 1
          fi
          echo "src/gen is empty — building the setup host."

      - name: Cache toolchain pack
        uses: actions/cache@v4
        with:
          path: .cache/toolchain-pack
          key: cmake-clang-v1-${{ matrix.artifact }}-${{ inputs.toolchain_tag || 'latest' }}

      - name: Fetch toolchain pack
        run: |
          set -euo pipefail
          ARGS=(--artifact "${{ matrix.artifact }}")
          if [[ -n "${{ inputs.toolchain_tag }}" ]]; then
            ARGS+=(--tag "${{ inputs.toolchain_tag }}")
          fi
          bash snesrecomp/tools/ci/fetch_toolchain.sh "${ARGS[@]}"

      # The macOS pack is cmake + ninja + python; SDL3 comes from
      # runner.cmake's pinned source fallback. Prefetch the tarball with curl
      # (HTTP/1.1) and cache it, so configure does not download.
      - name: Cache SDL3 source (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-src-3.4.10

      - name: Prefetch SDL3 source (macOS)
        if: runner.os == 'macOS'
        run: bash snesrecomp/tools/ci/prefetch_sdl3.sh --out-dir .cache/sdl3-src

      - name: Configure and build the setup host
        run: |
          set -euo pipefail
          # The pack's env.sh is its own statement of how to use it (PATH,
          # CC/CXX, sysroot, SDL3_DIR). Source it rather than restate it.
          # shellcheck disable=SC1091
          source "${TOOLCHAIN_DIR}/env.sh"
          echo "cmake: $(command -v cmake) ($(cmake --version | head -n1))"
          echo "cc:    ${CC:-$(command -v cc)}"
          EXTRA=()
          if [[ -n "${SNESRECOMP_SDL3_SOURCE_DIR:-}" ]]; then
            EXTRA+=("-DSNESRECOMP_SDL3_SOURCE_DIR=${SNESRECOMP_SDL3_SOURCE_DIR}")
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SETUP_HOST=ON \
            -DSNESRECOMP_ENABLE_TRACE=OFF \
            -DSNESRECOMP_BUILD_VERSION="${RELEASE_VERSION}" \
            "${EXTRA[@]+"${EXTRA[@]}"}"
          cmake --build build-ci -j"${JOBS}" --target "${EXE_NAME}"
          # Remove any cache created by a future framework post-build change.
          rm -f rom.cfg build-ci/rom.cfg

      - name: Package setup pack
        run: |
          set -euo pipefail
          # The packager inspects the executable's imports and zips the
          # stage; Git Bash on Windows has neither tool, the pack does.
          # shellcheck disable=SC1091
          source "${TOOLCHAIN_DIR}/env.sh"
          ARGS=()
          if [[ "${{ inputs.embed_toolchain }}" != "false" ]]; then
            ARGS+=(--embed-toolchain)
          fi
          bash scripts/package_release.sh build-ci "${{ matrix.artifact }}" "${ARGS[@]+"${ARGS[@]}"}"
          ls -la dist/

      # Verify the actual ZIP as a separate step, like Worms' package checks.
      - name: Verify setup pack contents
        env:
          PLATFORM: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          ZIP="dist/kirbysuperstar-${RELEASE_VERSION}-${PLATFORM}.zip"
          python3 - "${ZIP}" <<'PY'
          from pathlib import PurePosixPath
          import sys
          import zipfile

          archive_path = sys.argv[1]
          with zipfile.ZipFile(archive_path) as zf:
              names = zf.namelist()
              paths = [PurePosixPath(name) for name in names]
              bad = []
              for name, path in zip(names, paths):
                  parts = path.parts
                  if path.name.lower() == "rom.cfg":
                      bad.append(f"machine-specific ROM path cache: {name}")
                  if path.suffix.lower() in {".sfc", ".smc", ".srm", ".fig"}:
                      bad.append(f"ROM or memory-card data: {name}")
                  if path.suffix.lower() == ".c" and len(parts) >= 3 and parts[-3:-1] == ("src", "gen"):
                      bad.append(f"generated ROM-derived C: {name}")
                  if parts[-2:] == ("recomp", "funcs.h"):
                      bad.append(f"generated ROM-derived header: {name}")
                  if parts[-2:] == ("mods", "state.toml"):
                      bad.append(f"per-machine mod state: {name}")
                  if ".git" in parts:
                      bad.append(f"Git metadata: {name}")
              for required in ("CMakeLists.txt", "rom_identity.txt", "README.txt"):
                  if not any(path.name == required for path in paths):
                      bad.append(f"missing required setup file: {required}")
              for required in ("updater.py", "cacert.pem", "BUILD_PROVENANCE.json"):
                  if not any(path.name == required and path.parent.name == "update" for path in paths):
                      bad.append(f"missing updater runtime file: update/{required}")
              if bad:
                  for item in bad:
                      print(f"::error::{item}", file=sys.stderr)
                  raise SystemExit("Refusing to publish this setup pack.")
              print(f"Verified {archive_path}: no rom.cfg, ROM images, generated code, or per-machine state.")
          PY

      # When a private verified-ROM URL is configured, generate the game code
      # only in this ephemeral runner and publish playable, platform-native outputs.
      - name: Build and package playable native release
        if: env.KIRBY_ROM_URL != ''
        run: |
          set -euo pipefail
          source "${TOOLCHAIN_DIR}/env.sh"
          ROM="$RUNNER_TEMP/kirby-super-star-release.sfc"
          # Mega share links need MEGA's API and link decryption key. A plain
          # curl fetch returns the ~2 KB browser page, not the ROM bytes.
          node --version
          npm --version
          npm install --prefix "$RUNNER_TEMP/mega-rom-downloader" --no-save --ignore-scripts megajs@1.3.10
          KIRBY_ROM_OUTPUT="$ROM" \
            NODE_PATH="$RUNNER_TEMP/mega-rom-downloader/node_modules" \
            node scripts/download_mega_rom.cjs
          test -s "$ROM" || { echo "::error::MEGA ROM download was empty."; exit 1; }
          EXTRA=()
          if [[ -n "${SNESRECOMP_SDL3_SOURCE_DIR:-}" ]]; then
            EXTRA+=("-DSNESRECOMP_SDL3_SOURCE_DIR=${SNESRECOMP_SDL3_SOURCE_DIR}")
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          bash tools/regen.sh --rom "$ROM"
          cmake -S . -B build-playable -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_SETUP_HOST=OFF \
            -DSNESRECOMP_ENABLE_TRACE=OFF \
            -DSNESRECOMP_BUILD_VERSION="${RELEASE_VERSION}" \
            "${EXTRA[@]}"
          cmake --build build-playable -j"$JOBS" --target "${EXE_NAME}"

          # A compiler success is not evidence that the PPU produces a visible
          # picture. Smoke-test the actual ROM-derived binary before packaging
          # it, using the framework's headless SDL + screenshot path.
          SMOKE="$RUNNER_TEMP/kirby-smoke-test"
          mkdir -p "$SMOKE"
          cat >"$SMOKE/config.ini" <<'SMOKE_CONFIG'
          [Graphics]
          OutputMethod = SDL-Software
          NewRenderer = 1
          WindowScale = 1

          [General]
          DisableFrameDelay = 1
          Autosave = 0
          SkipLauncher = 1

          [Sound]
          EnableAudio = 0
          SMOKE_CONFIG
          GAME="$GITHUB_WORKSPACE/build-playable/${EXE_NAME}"
          if [[ "${{ matrix.artifact }}" == "windows-x64" ]]; then GAME="$GAME.exe"; fi
          set +e
          (
            cd "$SMOKE"
            SDL_VIDEODRIVER=dummy \
            SDL_AUDIODRIVER=dummy \
            SNESRECOMP_RUN_FRAMES=3600 \
            SNESRECOMP_SCREENSHOT="$SMOKE/frame.ppm" \
            SNESRECOMP_SCREENSHOT_FRAME=3600 \
            SNESRECOMP_STATE_TRACE="$SMOKE/state.csv" \
            SNESRECOMP_FRAMEDUMP_PIXELS=1 \
            SNESRECOMP_FRAMEDUMP_VIDEO=1 \
            SNESRECOMP_FRAMEDUMP_START=3598 \
            SNESRECOMP_FRAMEDUMP_END=3600 \
              "$GAME" --no-launcher --rom "$ROM" --config "$SMOKE/config.ini" --framedump "$SMOKE/frames"
          ) >"$SMOKE/game.log" 2>&1
          GAME_RC=$?
          set -e
          if [[ "$GAME_RC" -ne 0 ]]; then
            cat "$SMOKE/game.log"
            echo "::error::Playable binary exited with code $GAME_RC during the headless render smoke test."
            exit "$GAME_RC"
          fi
          if [[ ! -s "$SMOKE/frame.ppm" ]]; then
            cat "$SMOKE/game.log"
            echo "::error::Playable binary did not produce its requested rendered-frame screenshot."
            exit 1
          fi
          python3 - "$SMOKE/frame.ppm" <<'PY_SMOKE'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          header, sep, pixels = raw.partition(b"\n255\n")
          if not sep or not header.startswith(b"P6\n"):
              raise SystemExit("::error::Screenshot is not a valid binary PPM.")
          dimensions = re.findall(rb"\d+", header[2:])
          if len(dimensions) != 2:
              raise SystemExit("::error::Screenshot has an invalid PPM dimension header.")
          width, height = map(int, dimensions)
          if width < 256 or height < 224 or len(pixels) != width * height * 3:
              raise SystemExit(
                  f"::error::Screenshot data size is invalid: {width}x{height}, "
                  f"{len(pixels)} pixel bytes."
              )
          triples = zip(pixels[0::3], pixels[1::3], pixels[2::3])
          nonblack = 0
          colors = set()
          for r, g, b in triples:
              colors.add((r, g, b))
              nonblack += (r > 8 or g > 8 or b > 8)
          ratio = nonblack / (width * height)
          print(f"Headless render: {width}x{height}; nonblack pixels={nonblack} ({ratio:.1%}); distinct colors={len(colors)}")
          if nonblack < 1000 or ratio < 0.01 or len(colors) < 8:
              raise SystemExit(
                  "::error::Black/near-empty rendered frame detected; refusing to package or publish this build."
              )
          print("Headless render smoke test passed: captured a nonblack, nontrivial frame.")
          PY_SMOKE

          rm -f "$ROM"
          bash scripts/package_playable_release.sh build-playable "${{ matrix.artifact }}" "${RELEASE_VERSION}"
          ls -lh dist/

      # Without a private ROM URL the existing setup-native wrappers remain as fallback.
      - name: Preserve render smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kirby-render-smoke-failure-${{ matrix.artifact }}
          path: ${{ runner.temp }}/kirby-smoke-test/**
          if-no-files-found: warn
          retention-days: 7

      - name: Package Windows setup installer
        if: env.KIRBY_ROM_URL == '' && matrix.artifact == 'windows-x64'
        run: bash scripts/package_native_release.sh "${{ matrix.artifact }}" "${RELEASE_VERSION}"

      - name: Package macOS setup app and DMG
        if: env.KIRBY_ROM_URL == '' && startsWith(matrix.artifact, 'macos-')
        run: bash scripts/package_native_release.sh "${{ matrix.artifact }}" "${RELEASE_VERSION}"

      - name: Package Linux setup AppImage
        if: env.KIRBY_ROM_URL == '' && matrix.artifact == 'linux-x64'
        run: bash scripts/package_native_release.sh "${{ matrix.artifact }}" "${RELEASE_VERSION}"

      - name: Verify native outputs
        env:
          PLATFORM: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            windows-x64)
              test -s "dist/kirbysuperstar-${RELEASE_VERSION}-windows-x64.exe"
              if [[ -n "${KIRBY_ROM_URL:-}" ]]; then
                test -s "dist/kirbysuperstar-${RELEASE_VERSION}-windows-x64-playable.zip"
              fi
              ;;
            macos-arm64|macos-x64)
              test -s "dist/kirbysuperstar-${RELEASE_VERSION}-${PLATFORM}.dmg"
              test -s "dist/kirbysuperstar-${RELEASE_VERSION}-${PLATFORM}-app.zip"
              ;;
            linux-x64) test -s "dist/kirbysuperstar-${RELEASE_VERSION}-linux-x64.AppImage" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PREFIX }}-${{ matrix.artifact }}
          path: |
            dist/${{ env.ZIP_PREFIX }}-*-${{ matrix.artifact }}*.zip
            dist/${{ env.ZIP_PREFIX }}-*-${{ matrix.artifact }}.exe
            dist/${{ env.ZIP_PREFIX }}-*-${{ matrix.artifact }}.dmg
            dist/${{ env.ZIP_PREFIX }}-*-${{ matrix.artifact }}.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Tag and publish
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect setup/native packages and updater metadata
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG_NAME: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( \
            -name 'kirbysuperstar-*.zip' -o \
            -name 'kirbysuperstar-*.exe' -o \
            -name 'kirbysuperstar-*.dmg' -o \
            -name 'kirbysuperstar-*.AppImage' \) -exec cp -v {} dist/ \;

          # The updater consumes these exact four portable setup-pack names.
          for platform in linux-x64 windows-x64 macos-arm64 macos-x64; do
            filename="kirbysuperstar-${RELEASE_VERSION}-${platform}.zip"
            if [[ ! -f "dist/${filename}" ]]; then
              echo "::error::missing updater package dist/${filename}"
              ls -la dist/
              exit 1
            fi
            (cd dist && sha256sum "${filename}" > "SHA256SUMS-${platform}.txt")
          done

          # Native wrappers are additional manual-download assets.
          test -s "dist/kirbysuperstar-${RELEASE_VERSION}-windows-x64.exe"
          test -s "dist/kirbysuperstar-${RELEASE_VERSION}-linux-x64.AppImage"
          for platform in macos-arm64 macos-x64; do
            test -s "dist/kirbysuperstar-${RELEASE_VERSION}-${platform}.dmg"
            test -s "dist/kirbysuperstar-${RELEASE_VERSION}-${platform}-app.zip"
          done

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG_NAME"]
          metadata = {
              "repository": "NVDEMU/KirbySuperStarPC",
              "channel": "nightly" if tag == "Nightly" else "release",
              "tag": tag,
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "platforms": {
                  "linux-x64": f"kirbysuperstar-{version}-linux-x64.zip",
                  "windows-x64": f"kirbysuperstar-{version}-windows-x64.zip",
                  "macos-arm64": f"kirbysuperstar-{version}-macos-arm64.zip",
                  "macos-x64": f"kirbysuperstar-{version}-macos-x64.zip",
              },
              "native_assets": {
                  "windows-x64": f"kirbysuperstar-{version}-windows-x64.exe",
                  "linux-x64": f"kirbysuperstar-{version}-linux-x64.AppImage",
                  "macos-arm64": f"kirbysuperstar-{version}-macos-arm64.dmg",
                  "macos-x64": f"kirbysuperstar-{version}-macos-x64.dmg",
              },
          }
          Path("dist/nightly-manifest.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Generated checksum files and updater metadata for {tag}")
          PY

          # Catch malformed updater metadata before checksums or publication.
          python3 -m json.tool dist/nightly-manifest.json >/dev/null
          echo "nightly-manifest.json is valid JSON."

          # Overall SHA256SUMS covers all public platform assets and metadata.
          (cd dist && sha256sum kirbysuperstar-* nightly-manifest.json > SHA256SUMS)

      # The tag is created here, after all four builds succeeded, so a failed
      # build never leaves a version number claimed by nothing.
      - name: Move Nightly tag to the built commit
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Nightly "${GITHUB_SHA}"
          git push origin refs/tags/Nightly --force

      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists at $(git rev-parse --short "${TAG}") (re-release from that tag)"
          else
            git tag -a "${TAG}" -m "Kirby Super Star ${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "tagged ${GITHUB_SHA::12} as ${TAG}"
          fi

      - name: Release notes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          KIRBY_ROM_URL: ${{ secrets.KIRBY_ROM_URL }}
        run: |
          set -euo pipefail
          ROM_FILE="$(python3 snesrecomp/tools/rom_identity.py rom_identity.txt --get rom_file)"
          ROM_SHA256="$(python3 snesrecomp/tools/rom_identity.py rom_identity.txt --get expected_sha256)"
          {
            echo "Kirby Super Star Recomp ${TAG}"
            echo
            if [[ -n "${KIRBY_ROM_URL:-}" ]]; then
              echo "This release includes playable native builds for macOS, Windows, and Linux."
              echo "Each build includes the compiled recompiled program and requires your own verified"
              echo "${ROM_FILE} at runtime. No ROM image or local ROM path is included."
              echo "The Windows EXE installs the playable runtime and launches it; the macOS DMG"
              echo "contains a real .app bundle; the Linux AppImage launches the playable build."
            else
              echo "This release contains setup packs and native launch wrappers, not a prebuilt game."
              echo "On first launch, choose your own ${ROM_FILE} (SHA-256 ${ROM_SHA256}), then select"
              echo "Generate & rebuild. No ROM image is shipped."
              echo
              echo "The Windows EXE is a self-contained setup installer. The macOS DMG contains a"
              echo "real .app bundle. The Linux AppImage initializes a writable per-user setup folder."
            fi
            echo "Your ROM path cache is created locally and is never included in release assets."
            echo
            echo "The portable ZIP is the updater payload, with a per-platform SHA-256 file."
            echo
            echo '### Framework revisions'
            echo
            echo '```'
            bash snesrecomp/tools/ci/record_pins.sh
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.tag == 'Nightly' && 'Kirby Super Star Recomp Nightly' || format('Kirby Super Star Recomp {0}', needs.preflight.outputs.tag) }}
          prerelease: ${{ needs.preflight.outputs.tag == 'Nightly' }}
          overwrite_files: true
          body_path: notes.md
          files: |
            dist/${{ env.ZIP_PREFIX }}-*
            dist/SHA256SUMS
            dist/SHA256SUMS-*.txt
            dist/nightly-manifest.json
          fail_on_unmatched_files: true
          make_latest: ${{ needs.preflight.outputs.tag == 'Nightly' && 'false' || 'true' }}
